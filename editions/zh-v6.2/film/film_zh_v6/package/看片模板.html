<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>能力的影子 · 看片室</title>
<style>
:root{color-scheme:dark;--bg:#10110f;--text:#f3f0e7;--dim:#b2b4ad;--line:#393b34;--mint:#79dec1;--gold:#f7d469;font-family:"Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;font-size:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.45}main{max-width:1510px;margin:auto;padding:28px clamp(17px,3.8vw,68px) 48px}.head{display:flex;align-items:baseline;justify-content:space-between;gap:17px;padding:1px 0 21px}.series{color:var(--gold);font:600 .78rem/1.6 system-ui;letter-spacing:.12em}.head h1{font:500 clamp(1.65rem,3.5vw,3.1rem)/1.23 "Noto Serif CJK SC","Songti SC",serif;margin:.16em 0 0;letter-spacing:-.045em}.running,.here,time{font-variant-numeric:tabular-nums}.running{font-size:.9rem;color:var(--dim)}.house{display:grid;grid-template-columns:minmax(0,1fr) minmax(206px,249px);gap:clamp(17px,2.2vw,40px);align-items:start}.screen{margin:0;min-width:0}.viewport{position:relative;background:#000;aspect-ratio:16/9}video{display:block;width:100%;height:100%;background:#000;object-fit:contain}.playmark{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:71px;height:71px;background:#0d0e0ed9;border:1px solid #f3f0e795;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer}.playmark svg{width:25px;height:25px;transform:translateX(2px)}.playmark:hover{background:#26271d;color:var(--gold)}.playmark[hidden]{display:none}.below{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.now{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}.here{font:500 .81rem/1.4 ui-monospace,monospace;color:var(--mint)}.now strong{font-size:.98rem;font-weight:500}.timestamp,.chapter,.excerpt{font:inherit;color:inherit;cursor:pointer}.timestamp{white-space:nowrap;color:var(--dim);background:none;border:0;border-bottom:1px dotted #73746e;padding:2px 1px;font-size:.81rem}.timestamp:hover,.links a:hover{color:var(--mint)}.context{color:var(--dim);font:.93rem/1.65 "Noto Serif CJK SC",serif;margin:12px 0}.clipnote{display:block;font-size:.80rem;color:var(--gold)}.clipnote:empty{display:none}button:focus-visible,a:focus-visible,input:focus{outline:2px solid var(--gold);outline-offset:3px}.manual{margin:8px 0;width:min(100%,385px);background:#232520;color:white;border:1px solid #787d72;padding:.38rem .6rem}.rail h2,.cuts h2,.links h2{font-size:.81rem;color:var(--dim);font-weight:500;letter-spacing:.13em;margin:0}.rail h2{padding-bottom:9px}.chapter{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;display:grid;grid-template-columns:3.7em 1fr 8px;gap:5px;align-items:baseline;text-align:left;padding:clamp(8px,1.04vw,16px) 6px}.chapter b{font-weight:500;font-size:.97rem}.chapter time,.excerpt time{color:var(--dim);font:.79rem/1.5 ui-monospace,monospace}.chapter:hover,.excerpt:hover{background:#1a1c18}.chapter[aria-current=true] time,.chapter[aria-current=true] b{color:var(--gold)}.chapter[aria-current=true] .mark{background:var(--gold);width:5px;height:5px;border-radius:50%;align-self:center}.shelf{display:grid;grid-template-columns:minmax(0,1fr) minmax(206px,249px);gap:clamp(17px,2.2vw,40px);margin-top:27px}.cuts h2,.links h2{margin-bottom:11px}.excerpt{display:grid;grid-template-columns:minmax(94px,1fr) minmax(0,2.8fr) 7ch;align-items:baseline;gap:13px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 6px}.term{font:500 1.05rem/1.5 Georgia,"Noto Serif CJK SC",serif;color:var(--mint)}.explain{font-size:.9rem}.links a{display:block;width:fit-content;color:#e2e1d9;text-decoration:none;font-size:.88rem;line-height:1.7;margin-bottom:4px}.links a span{color:#92968c;font-size:.76rem}.status{background:#1d1f19;padding:12px 15px}.status a{color:var(--mint)}.status[hidden]{display:none}footer{font-size:.75rem;color:#aaa99f;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:850px){main{padding:18px 18px 30px}.house{grid-template-columns:minmax(0,1fr)}.rail{margin-top:2px}.chapter{padding:8px 5px}.railnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}.chapter{grid-template-columns:3.1em 1fr 3px}.chapter b{font-size:.86rem}.shelf{grid-template-columns:minmax(0,1fr) minmax(147px,.5fr)}}
@media(max-width:510px){.running{font-size:.74rem}.head{flex-wrap:wrap;gap:3px;padding-bottom:14px}.head h1{font-size:1.74rem}.running{display:none}.chapter{grid-template-columns:2.85em 1fr 4px}.railnav{grid-template-columns:repeat(2,minmax(0,1fr))}.shelf{grid-template-columns:1fr;gap:20px}.playmark{width:49px;height:49px}.playmark svg{width:17px;height:17px}.excerpt{grid-template-columns:minmax(75px,.7fr) minmax(0,1.4fr) 7ch;gap:8px}.term{font-size:.96rem}.explain{font-size:.83rem}.below{padding:10px 0}.timestamp{font-size:.76rem}}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.manual:focus{width:100%;scroll-margin-top:30px} .clipnote:not(:empty){color:var(--mint)}.links a{line-height:1.65}.excerpt time{text-align:right;white-space:nowrap}
.voicebox{max-width:800px;margin-top:32px}.voicebox h2{font:500 1.22rem/1.4 "Noto Serif CJK SC",serif;margin:0 0 8px}.voicebox p{font-size:.86rem;color:var(--dim);margin:0 0 14px}.take{display:grid;grid-template-columns:4.25rem minmax(0,1fr) auto auto;gap:clamp(5px,1.5vw,16px);align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.89rem}.take time{color:var(--dim);font:.82rem ui-monospace,monospace}.take button{font:inherit;color:var(--text);border:1px solid var(--line);background:transparent;cursor:pointer;padding:.25rem .56rem}.take button:hover,.take button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}.voicebox audio{display:block;width:min(100%,390px);height:38px;margin-top:13px}
.cuts section + section{margin-top:24px}
</style></head>
<body><main><header class="head"><div><div class="series">STANFORD CS336　 /　 12</div><h1>能力的影子</h1></div><div class="running">中文旁白　/　@@length@@</div></header>
<div class="house"><figure class="screen"><div class="viewport"><video id="film" controls playsinline preload="metadata" src="@@movie@@" poster="@@poster@@" aria-label="播放《能力的影子》字幕版"></video><button id="start" class="playmark" type="button" aria-label="播放影片"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2 18 10 4 18Z" fill="currentColor"/></svg></button></div><figcaption><div class="below"><div class="now"><span id="clock" class="here">00:00</span><strong id="now">分数与投影</strong></div><button id="stamp" class="timestamp" type="button">复制时码与台词</button></div><p id="context" class="context">分数在升，新题的正确率却在降。</p><span class="clipnote" role="status" id="note"></span><input class="manual" id="manual" readonly aria-label="反馈时码" hidden></figcaption><div class="status" id="miss" hidden>请把本页和字幕版 MP4 放在同一个文件夹，或<a href="@@movie@@">直接打开影片</a>。</div></figure>
<aside class="rail" aria-label="章节"><h2>按章节看</h2><nav class="railnav">@@chapters@@</nav></aside></div>
<div class="shelf"><div class="cuts"><section aria-labelledby="question-stops"><h2 id="question-stops">问句后的过渡</h2>@@question-stops@@</section><section><h2>镜头选看</h2>@@examples@@</section></div><section class="links"><h2>随片材料</h2>@@links@@</section></div>
@@voice@@
<footer>Stanford CS336 第十二讲　·　模型评估指标与基准测试评测　·　后期打磨 v6.2　·　1080p / 60 fps</footer></main>
<script>
const words=@@words@@, rests=@@rests@@, chapters=@@timeline@@, scenes=@@scenes@@, v=document.getElementById('film'), stick=document.getElementById('start');
const $=x=>document.getElementById(x), fmt=(time,dec=false)=>{const n=Math.floor(time*10+0.0001),s=Math.floor(n/10);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+(dec?'.'+n%10:'')}, entries=[...document.querySelectorAll('.chapter')];let act=-1,pending=null;
function signal(){const t=v.currentTime||0;let i=0;while(i+1<chapters.length&&t+.004>=chapters[i+1].t)i++;$('clock').textContent=fmt(t);if(i!==act){$('now').textContent=chapters[i].name;$('context').textContent=chapters[i].caption;entries.forEach((e,j)=>{if(i===j)e.setAttribute('aria-current','true');else e.removeAttribute('aria-current')});act=i}}
function play(){v.play().catch(()=>{stick.hidden=false;stick.setAttribute('aria-label','继续播放')})}
function go(t){if(v.readyState>=1){v.currentTime=t;play()}else{pending=t;v.load()}}
stick.addEventListener('click',play);document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{go(Number(e.dataset.t))});v.addEventListener('loadedmetadata',()=>{$('miss').hidden=true;if(pending!==null){const t=pending;pending=null;go(t)}signal()});v.addEventListener('play',()=>stick.hidden=true);v.addEventListener('ended',()=>{stick.hidden=false;stick.setAttribute('aria-label','从片头重播')});v.addEventListener('timeupdate',signal);v.addEventListener('seeked',signal);v.addEventListener('error',()=>{$('miss').hidden=false;stick.hidden=true});signal();
$('stamp').onclick=async()=>{const t=v.currentTime||0;let scene=scenes[0];for(const r of scenes){if(r.t>t+.004)break;scene=r}const cap=words.find(r=>r[0]<=t && t<r[1]), rest=rests.find(r=>r[0]<=t && t<r[1]);const s=fmt(t,true)+' · '+scene.label+'（镜头 '+scene.id+'）'+(cap?'｜“'+cap[2]+'”':rest?'｜'+rest[2]:'');try{await navigator.clipboard.writeText(s);$('note').textContent='已复制：'+s;$('manual').hidden=true}catch{const input=$('manual');input.hidden=false;input.value=s;input.focus();input.select();$('note').textContent='复制已选中的时码即可。'}};
const voice=$('voices');
if(voice){
 const btns=[...document.querySelectorAll('[data-voice-from]')];let chosen=null,limit=Infinity,queued=null;
 const off=()=>{chosen?.setAttribute('aria-pressed','false');chosen=null;limit=Infinity};
 const cue=(b)=>{const start=Number(b.dataset.voiceFrom);limit=Number(b.dataset.voiceTo);chosen?.setAttribute('aria-pressed','false');chosen=b;b.setAttribute('aria-pressed','true');voice.currentTime=start;void voice.play().catch(off)};
 btns.forEach(b=>{b.setAttribute('aria-pressed','false');b.onclick=()=>{
   v.pause();if(voice.readyState>=1)cue(b);else {queued=b;voice.load()}
 }});
 voice.addEventListener('loadedmetadata',()=>{if(queued){const b=queued;queued=null;cue(b)}});
 voice.addEventListener('play',()=>v.pause());v.addEventListener('play',()=>{queued=null;voice.pause();off()});
 voice.addEventListener('timeupdate',()=>{if(voice.currentTime>=limit){voice.pause();off()}});
 voice.addEventListener('pause',off);voice.addEventListener('ended',off);
}
</script></body></html>
