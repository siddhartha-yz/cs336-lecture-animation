name: Production check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: |
            lectures/l15-upper/package-lock.json
            production/cs336-lecture-animation/assets/remotion-starter/package-lock.json
      - name: Intake and cue validation
        run: |
          python3 pipeline/lecture.py check-all
          python3 -m unittest discover -s pipeline/tests
      - name: Lecture 15 upper source and frame clock
        working-directory: lectures/l15-upper
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint:visuals
          npm run check:frames
      - name: Bootstrap and render an actual Remotion frame
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg fontconfig
          export REMOTION_BROWSER="$(command -v google-chrome)"
          test -x "$REMOTION_BROWSER"
          python3 production/cs336-lecture-animation/scripts/init_lecture.py "$RUNNER_TEMP/cs336-frame" --renderer remotion
          cd "$RUNNER_TEMP/cs336-frame"
          npm ci --no-audit --no-fund
          node scripts/lint-visuals.mjs
          npm run still -- shift build/shift.png --frame=85
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 build/shift.png)" = "1920,1080"
